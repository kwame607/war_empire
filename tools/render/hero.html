<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script type="module">
import { THREE, M, tree } from './lib.js';
import { keepHall, keepCastle, regiment, sailingShip, cottage, barracks, library, academy, armoury, bureau, shipyard, farm, timber, quarry, workshop, market } from './buildings.js';

const rim = new THREE.DirectionalLight(0xffb98a, 1.0); rim.position.set(-10, 6, -8); scene.add(rim);

if (BANNERS[name]) {

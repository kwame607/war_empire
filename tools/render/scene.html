<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script type="module">
import { THREE } from './lib.js';
import { tent, ITEMS } from './scenes.js';
const q = new URLSearchParams(location.search);
const icon = q.get('icon'); const W = Number(q.get('w') || 1600), H = Number(q.get('h') || 1100);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: !!icon, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = Number(q.get('exp') || 1.05); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(icon ? 0x000000 : 0x120c06, icon ? 0 : 1);
const scene = new THREE.Scene();
if (icon) {
  const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 50); cam.position.set(0.9, 0.8, 1.3); cam.lookAt(0, 0.12, 0);
  scene.add(new THREE.HemisphereLight(0xfff0d8, 0x8a7a6a, 3.2)); const d = new THREE.DirectionalLight(0xffe8c8, 4.2); d.position.set(2, 3, 2); d.castShadow = false; scene.add(d);
  const o = ITEMS[icon].make(); const box = new THREE.Box3().setFromObject(o); const c = box.getCenter(new THREE.Vector3()); o.position.sub(c); o.position.y += 0.0; scene.add(o);
  const s = box.getSize(new THREE.Vector3()); const m = Math.max(s.x, s.y, s.z); cam.position.set(0.8 * m * 1.7, 0.7 * m * 1.7, 1.1 * m * 1.7); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam); window.done = true;
} else {
  const cam = new THREE.PerspectiveCamera(Number(q.get('fov') || 52), W / H, 0.1, 80); cam.position.set(0, 3.3, 10.6); cam.lookAt(0, 1.9, -2);
  scene.background = new THREE.Color(0x120c06);
  scene.add(new THREE.HemisphereLight(0xffe9c8, 0x5a4026, 1.5)); const fill = new THREE.PointLight(0xffd9a0, 40, 40, 1.4); fill.position.set(0, 4.5, 6); scene.add(fill);
  const key = new THREE.DirectionalLight(0xffcf94, 1.0); key.position.set(4, 10, 9); key.castShadow = true; key.shadow.mapSize.set(4096, 4096); const sc = key.shadow.camera; sc.left = -12; sc.right = 12; sc.top = 12; sc.bottom = -12; sc.far = 40; key.shadow.bias = -0.0005; scene.add(key);
  const room = tent(); scene.add(room);
  renderer.render(scene, cam);
  const hs = {}; for (const [id, p] of Object.entries(room.userData.hotspots)) { const v = new THREE.Vector3(...p).project(cam); hs[id] = [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H]; }
  window.hotspots = hs; window.done = true;
}
</script></body></html>
